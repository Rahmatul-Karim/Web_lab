<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlaySpace</title>
  <meta name="description" content="Your favorite apps and games in one place.">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='2.5' y='7' width='19' height='11' rx='5.5' fill='%236366f1'/><path d='M8 10v5M5.5 12.5h5' stroke='white' stroke-width='2' stroke-linecap='round'/><circle cx='16' cy='11.5' r='1' fill='white'/><circle cx='18.5' cy='14' r='1' fill='white'/></svg>">
</head>
<body>

  <!-- Top bar: logo, page links, search and light/dark button -->
  <header class="nav">
    <a class="brand" href="#top">
      <span class="logo"><svg viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M8 10v5M5.5 12.5h5"/><circle cx="16" cy="11.5" r=".6"/><circle cx="18.5" cy="14" r=".6"/></svg></span>
      <span>Play<span class="grad">Space</span></span>
    </a>
    <nav class="navlinks" id="navlinks">
      <button class="nl active" data-nav="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Home</button>
      <button class="nl" data-nav="App"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Apps</button>
      <button class="nl" data-nav="Game"><svg viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M8 10v5M5.5 12.5h5"/></svg>Games</button>
    </nav>
    <div class="tools">
      <div class="search" id="search">
        <input id="q" type="search" placeholder="Search apps and games" aria-label="Search apps and games" autocomplete="off">
        <button class="tool" id="searchBtn" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      </div>
      <button class="tool" id="themeBtn" aria-label="Switch light or dark mode">
        <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero" id="top">
    <div class="hero-copy">
      <p class="eyebrow">Play · Explore · Enjoy</p>
      <h1>Your Favorite<br><span class="grad">Apps &amp; Games</span><br>in One Place</h1>
      <p class="lead">Discover amazing apps and exciting games. Play, learn and have fun, all in PlaySpace.</p>
    </div>
    <div class="art-hero" aria-hidden="true">
      <i class="orbit"></i><i class="slab"></i>
      <svg class="hero-robot" viewBox="0 0 120 120"><use href="#ic-robo"/></svg>
      <div class="floats" id="floats"></div>
      <i class="sp s1">✦</i><i class="sp s2">✦</i><i class="sp s3">✦</i>
    </div>
  </section>

  <!-- Explore -->
  <main>
    <div class="head" id="launcher">
      <div><h2>Explore</h2><p class="sub">Choose between apps and games</p></div>
      <div class="seg" id="filters">
        <button class="seg-b active" data-cat="all"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>All</button>
        <button class="seg-b" data-cat="App"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="3"/><path d="M11 18h2"/></svg>Apps</button>
        <button class="seg-b" data-cat="Game"><svg viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M8 10v5M5.5 12.5h5"/></svg>Games</button>
      </div>
    </div>
    <div class="apps" id="apps"></div>
    <p class="empty" id="empty" hidden>Nothing matches your search. Try another word.</p>
  </main>

  <footer>
    <span class="brand"><span class="logo"><svg viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M8 10v5M5.5 12.5h5"/></svg></span><span>Play<span class="grad">Space</span></span></span>
    <p>More games. More fun.</p>
  </footer>

  <!-- Game screen (a game opens here) -->
  <section class="stage" id="stage" aria-hidden="true">
    <div class="bar-top">
      <span id="stageLogo"></span>
      <h3 id="stageTitle"></h3>
      <button class="back" id="backBtn">← Back</button>
    </div>
    <div class="play" id="play"></div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
